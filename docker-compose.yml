services:
  mongo:
    image: mongo:8
    container_name: mini-croper-mongo
    # Replica set de un nodo: las transacciones (reserva de stock, outbox) lo exigen.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Idempotente: si el replica set ya existe, rs.status() responde y no hace nada;
      # si no, lo inicia. El contenedor queda healthy cuando rs.status() funciona.
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: mini-croper-rabbitmq
    # RabbitMQ liga sus datos al hostname: fijo para que el volumen sobreviva a recrear el contenedor.
    hostname: mini-croper-rabbit
    ports:
      - '5672:5672'
      - '15672:15672' # consola de administración
    environment:
      # Credenciales de desarrollo (las mismas de .env.example); no son de producción.
      RABBITMQ_DEFAULT_USER: mini-croper
      RABBITMQ_DEFAULT_PASS: mini-croper-dev
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  rabbit-data:
